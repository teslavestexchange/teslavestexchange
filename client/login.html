<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Login | Teslavestexchange</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            950: '#0b0f17',
                            900: '#121824',
                            800: '#1a2332',
                        },
                        neon: {
                            green: '#00E676'
                        }
                    }
                }
            }
        }
    </script>

    <!-- External Custom Stylesheet -->
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-navy-950 text-slate-100 min-h-screen flex flex-col justify-between bg-grid-watermark ambient-green-glow">

    <!-- Top Navigation Header -->
    <header class="border-b border-slate-800/80 bg-navy-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-neon-gradient flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <span class="font-display font-extrabold text-slate-950 text-xl">T</span>
                </div>
                <span class="font-display text-lg sm:text-xl font-extrabold tracking-wider text-white">
                    TESLAVEST<span class="text-neon-green">EXCHANGE</span>
                </span>
            </a>

            <div class="text-xs font-mono text-slate-400">
                Don't have an account? 
                <a href="/client/register.html" class="text-neon-green font-bold hover:underline ml-1">Register</a>
            </div>
        </div>
    </header>

    <!-- Login Card Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="card-grey w-full max-w-md p-8 sm:p-10 space-y-8 relative overflow-hidden border-emerald-500/30">
            
            <div class="text-center space-y-2">
                <div class="inline-block bg-navy-950 border border-emerald-500/30 px-3 py-1 rounded-full text-[10px] font-mono text-neon-green">
                    • ENCRYPTED SESSION TERMINAL
                </div>
                <h1 class="font-display text-3xl font-extrabold uppercase text-white">Welcome Back</h1>
                <p class="text-xs text-slate-400">Access your trading dashboard and portfolio</p>
            </div>

            <!-- Form -->
            <form action="#" method="POST" class="space-y-5 font-mono text-xs">
                
                <!-- Username or Email -->
                <div class="space-y-1.5">
                    <label class="block text-slate-300 uppercase font-bold">Username or Email</label>
                    <input type="text" required placeholder="trader99" 
                        class="w-full bg-navy-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon-green transition-colors">
                </div>

                <!-- Password -->
                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label class="block text-slate-300 uppercase font-bold">Password</label>
                        <a href="#" class="text-[10px] text-neon-green hover:underline">Forgot?</a>
                    </div>
                    <input type="password" required placeholder="••••••••••••" 
                        class="w-full bg-navy-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon-green transition-colors">
                </div>

                <!-- Remember Me -->
                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="remember" class="accent-emerald-500 rounded">
                    <label for="remember" class="text-slate-400 text-[11px]">Remember login credentials</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-neon-green w-full py-3.5 rounded-xl text-sm font-bold uppercase tracking-wider mt-4">
                    Log In To Terminal
                </button>
            </form>

            <div class="text-center pt-2">
                <a href="/" class="text-slate-500 hover:text-slate-300 text-xs font-mono">← Back to Homepage</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-navy-950 py-4 text-center text-xs font-mono text-slate-500">
        © 2026 Teslavestexchange Engine. Encrypted Portal.
    </footer>

</body>
</html>
