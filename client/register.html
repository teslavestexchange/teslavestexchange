<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Teslavestexchange</title>
    <!-- Tailwind CSS for a professional, sleek layout -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-wider text-blue-400">TESLAVESTEXCHANGE</h1>
            <p class="text-slate-400 text-sm mt-1">Initialize your digital asset security profile</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="hidden p-3 rounded-lg text-sm mb-4 text-center"></div>

        <!-- Registration Form -->
        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
                <input type="email" id="email" required autocomplete="email"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Phone Number</label>
                <input type="tel" id="phone" autocomplete="tel"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <input type="password" id="password" required autocomplete="new-password"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-lg transition-colors shadow-lg shadow-blue-900/40">
                Initialize Profile
            </button>
        </form>
    </div>

    <!-- Frontend Form Handling Script -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            // Update UI state to loading
            submitBtn.disabled = true;
            submitBtn.innerText = "Processing Telemetry...";
            alertBox.className = "hidden";

            try {
                // Submit data to our backend serverless signup file
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, phone, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Temporarily store verification state in the user's browser storage
                    localStorage.setItem('pendingUserId', data.userId);
                    localStorage.setItem('simulatedOtp', data.otpCode);

                    alertBox.className = "p-3 rounded-lg text-sm mb-4 text-center bg-green-950 text-green-400 border border-green-800";
                    alertBox.innerText = "Telemetry accepted! Redirecting to verification panel...";

                    // Forward them to the OTP verification screen after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = '/verify.html';
                    }, 1500);
                } else {
                    throw new Error(data.error || 'Registration failed.');
                }

            } catch (error) {
                submitBtn.disabled = false;
                submitBtn.innerText = "Initialize Profile";
                alertBox.className = "p-3 rounded-lg text-sm mb-4 text-center bg-red-950 text-red-400 border border-red-800";
                alertBox.innerText = error.message;
            }
        });
    </script>
</body>
</html>
