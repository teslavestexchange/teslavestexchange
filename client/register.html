<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Teslavestexchange</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            950: '#0b0f17',
                            900: '#121824',
                            800: '#1a2332',
                        },
                        neon: {
                            green: '#00E676'
                        }
                    }
                }
            }
        }
    </script>

    <!-- External Custom Stylesheet -->
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-navy-950 text-slate-100 min-h-screen flex flex-col justify-between bg-grid-watermark ambient-green-glow">

    <!-- Top Navigation Header -->
    <header class="border-b border-slate-800/80 bg-navy-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-neon-gradient flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <span class="font-display font-extrabold text-slate-950 text-xl">T</span>
                </div>
                <span class="font-display text-lg sm:text-xl font-extrabold tracking-wider text-white">
                    TESLAVEST<span class="text-neon-green">EXCHANGE</span>
                </span>
            </a>

            <div class="text-xs font-mono text-slate-400">
                Already have an account? 
                <a href="/client/login.html" class="text-neon-green font-bold hover:underline ml-1">Log In</a>
            </div>
        </div>
    </header>

    <!-- Registration Card Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="card-grey w-full max-w-lg p-8 sm:p-10 space-y-8 relative overflow-hidden border-emerald-500/30">
            
            <div class="text-center space-y-2">
                <div class="inline-block bg-navy-950 border border-emerald-500/30 px-3 py-1 rounded-full text-[10px] font-mono text-neon-green">
                    • INSTITUTIONAL SECURE GATEWAY
                </div>
                <h1 class="font-display text-3xl font-extrabold uppercase text-white">Create Account</h1>
                <p class="text-xs text-slate-400">Start trading and earning automated yield in minutes</p>
            </div>

          <!-- Form -->
<form id="registerForm" class="space-y-5 font-mono text-xs">
    
    <!-- Full Name -->
    <div class="space-y-1.5">
        <label class="block text-slate-300 uppercase font-bold">Full Name</label>
        <input type="text" id="fullname" required placeholder="John Doe" 
            class="w-full bg-navy-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon-green transition-colors">
    </div>

    <!-- Username -->
    <div class="space-y-1.5">
        <label class="block text-slate-300 uppercase font-bold">Username</label>
        <input type="text" id="username" required placeholder="trader99" 
            class="w-full bg-navy-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon-green transition-colors">
    </div>

    <!-- Email Address -->
    <div class="space-y-1.5">
        <label class="block text-slate-300 uppercase font-bold">Email Address</label>
        <input type="email" id="email" required placeholder="investor@example.com" 
            class="w-full bg-navy-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon-green transition-colors">
    </div>

    <!-- Password -->
    <div class="space-y-1.5">
        <label class="block text-slate-300 uppercase font-bold">Password</label>
        <input type="password" id="password" required placeholder="••••••••••••" 
            class="w-full bg-navy-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neon-green transition-colors">
    </div>

    <!-- Terms Checkbox -->
    <div class="flex items-center space-x-2 pt-2">
        <input type="checkbox" id="terms" required class="accent-emerald-500 rounded">
        <label for="terms" class="text-slate-400 text-[11px]">
            I agree to the <a href="#" class="text-neon-green hover:underline">Terms of Service</a> & <a href="#" class="text-neon-green hover:underline">Privacy Policy</a>
        </label>
    </div>

    <!-- Submit Button -->
    <button type="submit" id="submitBtn" class="btn-neon-green w-full py-3.5 rounded-xl text-sm font-bold uppercase tracking-wider mt-4 flex items-center justify-center space-x-2">
        <span>Complete Registration</span>
    </button>
</form>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Sending Verification Email...";

        const payload = {
            fullname: document.getElementById('fullname').value,
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                // Save state and token returned from server for verify.html logic
                localStorage.setItem('pendingUserId', data.userId);
                localStorage.setItem('simulatedOtp', data.otpCode);
                localStorage.setItem('currentUser', JSON.stringify(payload));

                window.location.href = '/client/verify.html';
            } else {
                throw new Error(data.error || 'Failed to process registration');
            }
        } catch (err) {
            alert('Registration error: ' + err.message);
            submitBtn.disabled = false;
            submitBtn.innerText = "Complete Registration";
        }
    });
</script>

                <!-- Terms Checkbox -->
                <div class="flex items-center space-x-2 pt-2">
                    <input type="checkbox" id="terms" required class="accent-emerald-500 rounded">
                    <label for="terms" class="text-slate-400 text-[11px]">
                        I agree to the <a href="#" class="text-neon-green hover:underline">Terms of Service</a> & <a href="#" class="text-neon-green hover:underline">Privacy Policy</a>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-neon-green w-full py-3.5 rounded-xl text-sm font-bold uppercase tracking-wider mt-4">
                    Complete Registration
                </button>
            </form>

            <div class="text-center pt-2">
                <a href="/" class="text-slate-500 hover:text-slate-300 text-xs font-mono">← Back to Homepage</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-navy-950 py-4 text-center text-xs font-mono text-slate-500">
        © 2026 Teslavestexchange Engine. Encrypted Portal.
    </footer>

</body>
</html>
