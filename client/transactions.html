<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History & Profit Record | Teslavestexchange</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 950: '#030712', 900: '#0B192C', 800: '#1E3E62' },
                        brand: { gold: '#FFD700', goldHover: '#E6C200', green: '#00E676' }
                    }
                }
            }
        }
    </script>
    <style>
        .glow-gold-text { text-shadow: 0 0 12px rgba(255, 215, 0, 0.7); }
        .glow-card { box-shadow: 0 0 25px rgba(30, 62, 98, 0.3); }
    </style>
</head>
<body class="bg-navy-950 text-slate-100 min-h-screen flex flex-col justify-between font-mono text-xs">

    <!-- Header -->
    <header class="border-b border-navy-800 bg-navy-900/90 p-4 sticky top-0 z-50 flex justify-between items-center max-w-7xl mx-auto w-full">
        <a href="dashboard.html" class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-brand-gold flex items-center justify-center font-extrabold text-slate-950">T</div>
            <span class="font-extrabold text-white text-base">TESLAVEST<span class="text-brand-green">EXCHANGE</span></span>
        </a>
        <a href="dashboard.html" class="px-3 py-1.5 rounded-xl border border-navy-800 text-slate-300 hover:text-brand-gold">← Back to Dashboard</a>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
        <div>
            <h1 class="text-2xl font-black text-brand-gold glow-gold-text uppercase">Ledger & Activity Log</h1>
            <p class="text-slate-400 text-[11px] mt-1">Complete history of your deposits, withdrawals, and daily yield accruals.</p>
        </div>

        <!-- Ledger Table -->
        <div class="bg-navy-900 border border-navy-800 rounded-2xl glow-card overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-navy-800 bg-navy-950/50 text-slate-400 uppercase text-[10px]">
                            <th class="p-4">Type</th>
                            <th class="p-4">Amount</th>
                            <th class="p-4">Asset / Method</th>
                            <th class="p-4">Status</th>
                            <th class="p-4">Date & Time</th>
                        </tr>
                    </thead>
                    <tbody id="txTableBody" class="divide-y divide-navy-800/50">
                        <tr>
                            <td colspan="5" class="p-6 text-center text-slate-500">Loading ledger data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="border-t border-navy-800 bg-navy-950 py-4 text-center text-slate-500">
        © 2026 Teslavestexchange Engine. Encrypted Portal.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(localStorage.getItem('teslavest_user') || '{}');
            const tbody = document.getElementById('txTableBody');

            try {
                const res = await fetch(`/api/transactions/list?userId=${user.id}`);
                const data = await res.json();

                if (res.ok && data.transactions && data.transactions.length > 0) {
                    tbody.innerHTML = data.transactions.map(tx => {
                        let typeColor = 'text-white';
                        if (tx.type === 'DEPOSIT') typeColor = 'text-brand-green';
                        if (tx.type === 'WITHDRAWAL') typeColor = 'text-red-400';
                        if (tx.type === 'PROFIT') typeColor = 'text-brand-gold';

                        return `
                            <tr class="hover:bg-navy-800/30 transition">
                                <td class="p-4 font-bold ${typeColor}">${tx.type}</td>
                                <td class="p-4 font-bold">$${Number(tx.amount).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                                <td class="p-4 text-slate-300">${tx.asset || 'USDT_TRC20'}</td>
                                <td class="p-4"><span class="px-2 py-1 rounded bg-navy-950 text-slate-300 border border-navy-800 font-bold uppercase text-[9px]">${tx.status || 'Completed'}</span></td>
                                <td class="p-4 text-slate-400">${new Date(tx.createdAt || Date.now()).toLocaleString()}</td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500">No transaction or profit records logged yet.</td></tr>`;
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500">No transaction logs available yet.</td></tr>`;
            }
        });
    </script>
</body>
</html>
