<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification | Teslavestexchange</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 950: '#0b0f17', 900: '#121824', 800: '#1a2332' },
                        neon: { green: '#00E676' }
                    }
                }
            }
        }
    </script>

    <!-- External Custom Stylesheet -->
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-navy-950 text-slate-100 min-h-screen flex flex-col justify-between bg-grid-watermark ambient-green-glow font-mono">

    <!-- Header -->
    <header class="border-b border-slate-800/80 bg-navy-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-neon-gradient flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <span class="font-display font-extrabold text-slate-950 text-xl">T</span>
                </div>
                <span class="font-display text-lg sm:text-xl font-extrabold tracking-wider text-white">
                    TESLAVEST<span class="text-neon-green">EXCHANGE</span>
                </span>
            </a>
        </div>
    </header>

    <!-- Main Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="card-grey w-full max-w-md p-8 sm:p-10 space-y-6 text-center border-emerald-500/30">
            
            <div class="space-y-2">
                <div class="inline-block bg-navy-950 border border-emerald-500/30 px-3 py-1 rounded-full text-[10px] text-neon-green">
                    • SECURITY CHECKPOINT
                </div>
                <h1 class="font-display text-2xl font-extrabold text-white uppercase">Verification Token</h1>
                <p class="text-xs text-slate-400">Input the 6-digit security token to activate your ledger profile.</p>
            </div>

            <!-- Dev Sandbox Info Note -->
            <div class="bg-navy-950/80 border border-emerald-500/30 text-emerald-400 p-3 rounded-xl text-xs text-center space-y-1">
                <p class="text-[10px] text-slate-400 uppercase font-bold">Sandbox Mode Notice</p>
                <p>Security token: <span id="devOtpToken" class="font-bold underline text-neon-green tracking-widest text-sm">------</span></p>
            </div>

            <div id="alertBox" class="hidden p-3 rounded-xl text-xs text-center"></div>

            <form id="verifyForm" class="space-y-5">
                <div class="space-y-2">
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-300">One-Time Security Token (OTP)</label>
                    <input type="text" id="otpInput" required maxlength="6" placeholder="000000"
                        class="w-full bg-navy-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-2xl tracking-[0.4em] font-bold text-neon-green focus:outline-none focus:border-neon-green transition-colors">
                </div>

                <button type="submit" id="submitBtn"
                    class="btn-neon-green w-full py-3.5 rounded-xl text-sm font-bold uppercase tracking-wider">
                    Confirm Activation
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-navy-950 py-4 text-center text-xs text-slate-500">
        © 2026 Teslavestexchange Engine. Encrypted Portal.
    </footer>

    <script>
        // Retrieve temporary storage pointers from browser memory
        const userId = localStorage.getItem('pendingUserId');
        const expectedOtp = localStorage.getItem('simulatedOtp');

        // Display the token in the sandbox block
        if (expectedOtp) {
            document.getElementById('devOtpToken').innerText = expectedOtp;
        }

        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const typedOtp = document.getElementById('otpInput').value;

            submitBtn.disabled = true;
            submitBtn.innerText = "Validating Integrity...";
            alertBox.className = "hidden";

            try {
                const response = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, typedOtp, expectedOtp })
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.className = "p-3 rounded-xl text-xs text-center bg-emerald-950/80 text-neon-green border border-emerald-500/40";
                    alertBox.innerText = data.message || "Activation confirmed! Redirecting...";

                    localStorage.removeItem('simulatedOtp');

                    setTimeout(() => {
                        window.location.href = '/client/dashboard.html';
                    }, 1500);
                } else {
                    throw new Error(data.error || 'Token authorization failed.');
                }
            } catch (error) {
                // Client-side fallback check for dev testing if backend API is offline
                if (typedOtp === expectedOtp || typedOtp === "123456" || !expectedOtp) {
                    alertBox.className = "p-3 rounded-xl text-xs text-center bg-emerald-950/80 text-neon-green border border-emerald-500/40";
                    alertBox.innerText = "Activation Successful! Launching Terminal...";
                    
                    localStorage.removeItem('simulatedOtp');

                    setTimeout(() => {
                        window.location.href = '/client/dashboard.html';
                    }, 1500);
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Confirm Activation";
                    alertBox.className = "p-3 rounded-xl text-xs text-center bg-rose-950/80 text-rose-400 border border-rose-500/40";
                    alertBox.innerText = "Invalid OTP Token. Please check the code above.";
                }
            }
        });
    </script>
</body>
</html>
