<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds | Teslavestexchange</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 950: '#030712', 900: '#0B192C', 800: '#1E3E62' },
                        brand: { gold: '#FFD700', goldHover: '#E6C200', green: '#00E676' }
                    }
                }
            }
        }
    </script>
    <style>
        .glow-gold-text { text-shadow: 0 0 12px rgba(255, 215, 0, 0.7); }
        .glow-card { box-shadow: 0 0 25px rgba(30, 62, 98, 0.3); }
        .glow-gold-btn { box-shadow: 0 0 18px rgba(255, 215, 0, 0.3); }
    </style>
</head>
<body class="bg-navy-950 text-slate-100 min-h-screen flex flex-col justify-between font-mono text-xs">

    <!-- Header -->
    <header class="border-b border-navy-800 bg-navy-900/90 p-4 sticky top-0 z-50 flex justify-between items-center max-w-7xl mx-auto w-full">
        <a href="dashboard.html" class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-brand-gold flex items-center justify-center font-extrabold text-slate-950">T</div>
            <span class="font-extrabold text-white text-base">TESLAVEST<span class="text-brand-green">EXCHANGE</span></span>
        </a>
        <a href="dashboard.html" class="px-3 py-1.5 rounded-xl border border-navy-800 text-slate-300 hover:text-brand-gold">← Back to Dashboard</a>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-2xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="bg-navy-900 border border-navy-800 p-6 sm:p-8 rounded-2xl glow-card space-y-6">
            <div>
                <h1 class="text-2xl font-black text-brand-gold glow-gold-text uppercase">Withdraw Funds</h1>
                <p class="text-slate-400 text-[11px] mt-1">Request a payout directly to your external crypto wallet.</p>
            </div>

            <form id="withdrawForm" class="space-y-4">
                <!-- Select Asset -->
                <div class="space-y-1">
                    <label class="text-slate-300 uppercase font-bold">Payout Method</label>
                    <select id="asset" class="w-full bg-navy-950 border border-navy-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-gold">
                        <option value="USDT_TRC20">USDT (TRC20)</option>
                        <option value="BTC">Bitcoin (BTC)</option>
                        <option value="ETH">Ethereum (ERC20)</option>
                    </select>
                </div>

                <!-- Destination Wallet Address -->
                <div class="space-y-1">
                    <label class="text-slate-300 uppercase font-bold">Destination Wallet Address</label>
                    <input type="text" id="userAddress" required placeholder="Paste your wallet address here" class="w-full bg-navy-950 border border-navy-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-gold">
                </div>

                <!-- Withdrawal Amount -->
                <div class="space-y-1">
                    <label class="text-slate-300 uppercase font-bold">Withdrawal Amount ($USD)</label>
                    <input type="number" id="amount" min="20" required placeholder="e.g. 100" class="w-full bg-navy-950 border border-navy-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-gold">
                </div>

                <!-- Submit Request -->
                <button type="submit" id="submitBtn" class="w-full py-3.5 bg-brand-gold hover:bg-brand-goldHover text-slate-950 font-black rounded-xl uppercase tracking-wider glow-gold-btn">
                    Request Payout
                </button>
            </form>
        </div>
    </main>

    <footer class="border-t border-navy-800 bg-navy-950 py-4 text-center text-slate-500">
        © 2026 Teslavestexchange Engine. Encrypted Portal.
    </footer>

    <script>
        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "PROCESSING...";

            const amount = document.getElementById('amount').value;
            const asset = document.getElementById('asset').value;
            const userAddress = document.getElementById('userAddress').value;
            const user = JSON.parse(localStorage.getItem('teslavest_user') || '{}');

            try {
                const res = await fetch('/api/transactions/withdraw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: user.id, amount, asset, userAddress })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Withdrawal request logged successfully!');
                    window.location.href = 'transactions.html';
                } else {
                    alert(data.error || 'Withdrawal request failed.');
                }
            } catch (err) {
                alert('Server connectivity error.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "REQUEST PAYOUT";
            }
        });
    </script>
</body>
</html>
